<div id="modal">
	<div class="modal-underlay" hx-on:click="this.closest('#modal').remove()"></div>
	<div class="modal-content">
        <h3>Final State: {{ params.status }}</h3>
        <br>
        <br>
        <table>
            <tr>
                <th>Key</th><th>Value</th>
            </tr>
            {% for k, v in params.items() %}
                <tr>
                    <td>{{ k }}</td>
                    <td>{{ v }}</td>
                </tr>
            {% endfor %}
        </table>
		<br>
		<br>
		<button class="btn danger" hx-on:click="this.closest('#modal').remove()">Close</button>
	</div>
</div>
