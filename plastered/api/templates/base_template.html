<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plastered{% endblock %}</title>
    {# Static URLs MUST be root-relative: `url_for` bakes in the server-side origin, which htmx rejects behind a proxy. #}
    <link rel="stylesheet" href="/static/css/classless.css">
    <script src="/static/js/htmx.min.js"></script>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header id="site-header">
        <div class="bar">
            <a class="brand" href="/">plastered</a>
            <nav id="nav-links">
                <a href="/">Home</a>
                <a href="/lfm_recommendations_scraper">LFM Scraper</a>
                <a href="/adhoc">Ad-hoc Search</a>
                <a href="/run_history">Run History</a>
                <a href="/config">Config</a>
                <a href="/user_details">User Details</a>
            </nav>
            <button id="header-help-btn" hx-get="/static/html/help_modal.html" hx-target="body" hx-swap="beforeend">Help</button>
            {% if auth_enabled %}
            <form id="logout-form" method="post" action="/logout">
                <button id="header-logout-btn" type="submit">Log out</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
