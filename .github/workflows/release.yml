name: Release
run-name: Release from ${{ github.ref_name }} by ${{ github.actor }}

# One-click release flow (no draft release needed — versioning is driven by conventional commits):
#   1. Run this workflow (Actions -> Release -> Run workflow, from the default branch). It checks the
#      commits since the latest `vX.Y.Z` tag are conventional and warrant a bump (cog.toml sets
#      `from_latest_tag`/`tag_prefix`), computes the pending version with `cog bump --auto --dry-run`,
#      then validates + tests the repo on both release architectures and build-validates the app image
#      WITHOUT publishing anything (PLASTERED_RELEASE_TAG=v<pending version> stamps the build — the wheel
#      version comes from setuptools-scm — and the release-only test asserts it is a valid release tag
#      that matches the runtime-reported version).
#   2. Approve the `release` environment prompt. `cog bump --auto` then computes the next semver from the
#      conventional commits and tags the validated commit `vX.Y.Z` (tag-only: `disable_bump_commit` in
#      cog.toml means nothing is ever pushed to the branch, so `main` protection rules never conflict).
#      The tag is pushed via the `post_bump_hooks` in cog.toml, the GitHub release is created with the
#      cog-generated changelog as its body, and the Publish workflow is dispatched (see the `publish` job
#      below for why it is dispatched rather than `push`-triggered).
on:
  workflow_dispatch:

permissions:
  contents: read

# Never validate/tag two releases concurrently.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TEST_IMAGE_NAME: ${{ github.repository }}-test

jobs:
  # cocogitto-action@v4.2.0 pins cog 7.0.0 (the floating v4 tag lags behind and ships an older cog that
  # may not parse this repo's cog.toml).
  check-commits:
    name: Check conventional commits
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pending.outputs.version }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Releases must be run from '${DEFAULT_BRANCH}' (got '${GITHUB_REF_NAME}')."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # cog needs the full history and tags to find the latest release tag.
          fetch-depth: 0
      - name: Check commits since the latest tag are conventional
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
      - name: Compute the pending release version (dry run)
        id: pending
        run: |
          version="$(cog bump --auto --dry-run)"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'cog bump --auto --dry-run' produced '${version}', not a MAJOR.MINOR.PATCH \
          version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Validating ${GITHUB_SHA} for release v${version}."

  # Validation only, on a native runner per release architecture (no QEMU): full containerized check +
  # test pass in the test image (PLASTERED_RELEASE_TAG=v<pending version> stamps the build with the
  # cog-computed version and the release-only test asserts it is a valid release tag matching the
  # runtime-reported version), then a build of the app image. Nothing is pushed.
  validate:
    name: Validate + test (${{ matrix.arch }})
    needs: check-commits
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.TEST_IMAGE_NAME }}:${{ github.run_number }}
          target: plastered-test
          load: true
          build-args: |
            PLASTERED_RELEASE_TAG=v${{ needs.check-commits.outputs.version }}
      - name: UV lockfile check
        run: |
          docker run -t --rm --entrypoint bash ${{ env.TEST_IMAGE_NAME }}:${{ github.run_number }} -c 'uv lock --check'
      - name: Code format check
        run: |
          docker run -t --rm -e RUFF_CHECK_ONLY=1 -e GITHUB_ACTIONS=1 --entrypoint bash ${{ env.TEST_IMAGE_NAME }}:${{ github.run_number }} -c '/app/hooks/ruff.sh && /app/hooks/bandit.sh .'
      - name: Run unit tests
        run: |
          docker run -t -e GITHUB_ACTIONS=1 -e RELEASE_TESTS=1 --rm --entrypoint /app/tests/tests_entrypoint.sh ${{ env.TEST_IMAGE_NAME }}:${{ github.run_number }} tests
      - name: Build app image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: plastered-app
          build-args: |
            PLASTERED_RELEASE_TAG=v${{ needs.check-commits.outputs.version }}

  # The single manual gate: approving the `release` environment lets `cog bump --auto` compute the version
  # and push the `vX.Y.Z` tag, which lands directly on the validated commit (`disable_bump_commit` — no
  # commit is created, so nothing is pushed to `main`). Configure required reviewers on the `release`
  # environment in repo settings.
  approve-and-tag:
    name: Approve, tag, and publish release
    needs: [check-commits, validate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.github-release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute the version and push the release tag
        id: bump
        uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: bump
          args: --auto
      - name: Publish the GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.bump.outputs.version }}
        run: |
          cog changelog --at "${VERSION_TAG}" > GITHUB_CHANGELOG.md
          cat >> GITHUB_CHANGELOG.md <<EOF

          ### Container Image
          * Pull the latest release from GHCR:
              \`\`\`shell
              docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION_TAG#v}
              \`\`\`
          * View package details on the [plastered packages page](https://github.com/${GITHUB_REPOSITORY}/pkgs/container/plastered)
          EOF
          gh release create "${VERSION_TAG}" \
            --title "${VERSION_TAG#v}" \
            --notes-file GITHUB_CHANGELOG.md \
            --verify-tag
          echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::Tagged $(git rev-parse HEAD) as ${VERSION_TAG} and published the GitHub release."

  # Dispatch (not `push`-triggered): the tag above is created with the built-in GITHUB_TOKEN, and GitHub's
  # recursion guard means GITHUB_TOKEN-created refs never fire `push` workflows. `workflow_dispatch` is
  # exempt, so the Release workflow hands off to Publish explicitly.
  publish:
    name: Dispatch publish workflow
    needs: approve-and-tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger publish.yml for v${{ needs.approve-and-tag.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.approve-and-tag.outputs.version }}
        run: |
          gh workflow run publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "v${VERSION}" \
            -f version="${VERSION}"
