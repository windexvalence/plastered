# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# for info on above comment: https://github.com/dependabot/dependabot-core/issues/4605#issuecomment-2435660718
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    # Dependabot uses the commit message's first line as the PR title, and PRs are squash-merged with
    # the PR title as the commit — so the prefix must make dependabot PRs parse as conventional commits
    # (enforced by the `PR title` workflow, consumed by `cog bump --auto` at release time).
    commit-message:
      prefix: "chore(deps)"
    groups:  # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/optimizing-pr-creation-version-updates
      production-dependencies:
        dependency-type: "production"
        applies-to: version-updates
        exclude-patterns:
          - "bandit"
          - "pytest*"
          - "ruff"
          - "coverage-badge"
          - "mkdocs-click"
      development-dependencies:
        dependency-type: "development"
        applies-to: version-updates
        patterns:
          - "bandit"
          - "pytest*"
          - "ruff"
          - "coverage-badge"
        exclude-patterns:
          - "mkdocs-click"
