[project]
name = "plastered"
# The version is derived from the latest `vX.Y.Z` git tag by setuptools-scm (see
# [tool.setuptools_scm] below); it is never maintained by hand.
dynamic = ["version"]
requires-python = ">= 3.12"
dependencies = [
	"click==8.4.2",
	"anyio==4.14.2",
	"beautifulsoup4==4.15.0",
	"fastapi[all]==0.140.13",
	"httpx2>=2.9.1",
	"jinja2-fragments==1.12.0",
	"jsonschema==4.26.0",
	"pydantic==2.13.4",
	"pydantic-settings>=2.14.2",
	"Pygments>=2.20.0",
	"python-dotenv>=1.2.2",
	"python-multipart>=0.0.32",
	"PyYAML==6.0.3",
	"rebrowser-playwright==1.52.0",
	"rich==15.0.0",
	"soupsieve>=2.9.1",
	"sqlmodel==0.0.39",
	"starlette>=1.3.1",
	"tenacity==9.1.4",
	"urllib3==2.7.0",
]

[dependency-groups]
test = [
	"bandit==1.8.0",
	"coverage-badge==1.1.2",
	"fastapi[standard]",
	"ipython>=9.3.0",
	"mypy==1.19.1",
	"jsonschema-markdown==2025.10.1",
	"pytest==9.1.1",
	"pytest-cov[toml]==7.1.0",
	"pytest-httpx2>=1.0.0",
	"pytest-mock>=3.15.1",
	"pytest-socket>=0.8.0",
	"pytest-xdist==3.8.0",
	"ruff==0.16.0",
	"types-pyyaml>=6.0.12.20250516",
	"jsonref==1.1.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

# https://setuptools-scm.readthedocs.io/en/latest/
[tool.setuptools_scm]
# Without a git checkout (e.g. Docker builds, where .git is not in the build context) the version
# comes from $SETUPTOOLS_SCM_PRETEND_VERSION (set from the release tag in the Dockerfile) or, when
# that is unset (non-release builds), this fallback.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["plastered*"]

# Explicit patterns (rather than relying on setuptools-scm's git-tracked file finder): Docker builds
# have no .git in the build context, and htmx.min.js is gitignored (fetched at image build time), so
# both would be dropped from the wheel without this.
[tool.setuptools.package-data]
plastered = ["api/static/**/*", "api/templates/**/*.html", "config/*.yaml", "release_search/*.md"]

[tool.ruff]
exclude = [
	".bzr",
	".direnv",
	".eggs",
	".git",
	".git-rewrite",
	".hg",
	".ipynb_checkpoints",
	".mypy_cache",
	".nox",
	".pants.d",
	".pyenv",
	".pytest_cache",
	".pytype",
	".ruff_cache",
	".svn",
	".tox",
	".venv",
	".vscode",
	"__pypackages__",
	"_build",
	"buck-out",
	"build",
	"dist",
	"node_modules",
	"site-packages",
	"venv",
]
line-length = 120
indent-width = 4


# RUFF Linter
[tool.ruff.lint]
exclude = ["tests/**/*.py"]
select = [
	# pycodestyle
	"E",
	# Pyflakes
	"F",
	# pyupgrade
	"UP",
	# flake8-bugbear
	"B",
	# flake8-simplify
	"SIM",
	# isort
	"I",
]
extend-select = [
	# Async ruff rules: https://docs.astral.sh/ruff/rules/#flake8-async-async
	"ASYNC",
	"PYI045",  # https://docs.astral.sh/ruff/rules/iter-method-return-iterable/
	"PT024",  # https://docs.astral.sh/ruff/rules/pytest-unnecessary-asyncio-mark-on-fixture/
	"PLE1142",  # https://docs.astral.sh/ruff/rules/await-outside-async/
	"PLE1700",  # https://docs.astral.sh/ruff/rules/yield-from-in-async-function/
	"RUF006",  # https://docs.astral.sh/ruff/rules/asyncio-dangling-task/
	# FastAPI ruff rules: https://docs.astral.sh/ruff/rules/#fastapi-fast
	"FAST",
	# Logging ruff rules: https://docs.astral.sh/ruff/rules/#flake8-logging-log
	"LOG",
	# Type-checking runtime imports and other sanity checks: https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
	"TC",
	# Don't allow raising generic `Exception`: https://docs.astral.sh/ruff/rules/raise-vanilla-class/
	"TRY002",
]
# This is to get the line length auto-formatting mostly handled https://stackoverflow.com/a/77796620
ignore = ["E203", "E501"]

# https://docs.astral.sh/ruff/settings/#lintflake8-type-checking
[tool.ruff.lint.flake8-type-checking]
# https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_exempt-modules
exempt-modules = ["typing", "typing_extensions"]
# https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_runtime-evaluated-base-classes
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlalchemy.orm.DeclarativeBase", "sqlmodel.SQLModel"]

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lint_isort_split-on-trailing-comma
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
known-first-party = ["plastered"]

[tool.ruff.lint.pycodestyle]
# https://docs.astral.sh/ruff/rules/line-too-long/#why-is-this-bad
ignore-overlong-task-comments = true

# RUFF formatter
[tool.ruff.format]
# https://docs.astral.sh/ruff/settings/#format_skip-magic-trailing-comma
skip-magic-trailing-comma = true
# https://docs.astral.sh/ruff/settings/#format_docstring-code-format
docstring-code-format = true


# Pytest coverage configuration
# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
source = ["plastered"]
omit = [
    "plastered/utils/log_utils.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
skip_covered = true
# Regexes for lines to exclude from consideration
exclude_also = [
	# Don't complain about missing debug-only code:
	"def __repr__",
	"if self\\.debug",

	# Don't complain if tests don't hit defensive assertion code:
	"raise AssertionError",
	"raise NotImplementedError",

	# Don't complain if non-runnable code isn't run:
	"if 0:",
	"if __name__ == .__main__.:",

	# Don't complain about abstract methods, they aren't run:
	"@(abc\\.)?abstractmethod",

	"if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --cov=plastered --no-cov-on-fail --disable-socket --allow-hosts=testclient --durations=5"
markers = [
    "releasetest: mark test as a release-only test which should be skipped on non-release builds.",
    "slow: mark test as a slow test which should be skipped by default in non-CI builds unless `--slowtests` is provided.",
    "no_autouse_mock_lifespan_singleton_inst: mark a test to not use the auto-use fixture for the fastapi lifespan singleton.",
    "override_global_httpx_mock: mark a test to override the configured httpx2 global fixture in favor of its own.",
    # pytest-httpx2 1.0.0 defines this marker but its entry point doesn't expose the plugin's pytest_configure,
    # so register it here to avoid PytestUnknownMarkWarning.
    "httpx2(assert_all_called=False, assert_all_mocked=True, base_url=None): configure the httpx2_mock fixture (see https://lundberg.github.io/respx/api/#configuration).",
    "anyio: mark an async test to be run via anyio's pytest plugin (see the `anyio_backend` fixture in tests/conftest.py).",
]
filterwarnings = [
    "error:pytest.PytestWarning.*",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    "build_scripts/",
	"docs/",
	"examples/",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
# namespace_packages = false

[tool.bandit]
exclude_dirs = [
	".github",
	"docs",
	"examples",
	"tests",
	".venv",
]
